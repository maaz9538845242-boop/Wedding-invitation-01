    <!-- GSAP Animation Library -->

    <style>
        :root {
            --bg-canvas: #e8e3d8;
            --envelope-bg: #f5f2eb;
            --card-bg: #fffbf7;
            --text-primary: #22201e;
            --text-muted: #736d65;
            --accent-gold: #b39258;
            --border-lux: #d4ccb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
            height: 100vh;
            height: 100dvh;
        }

        /* Fine Paper Texture Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(0,0,0,0.05) 1px, transparent 0);
            background-size: 18px 18px;
            pointer-events: none;
            z-index: 999;
        }

        /* --- LUXURY 3D ENVELOPE SCREEN --- */
        #envelope-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh;
            background: #ded7c7;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            perspective: 1400px;
        }

        .envelope-container {
            width: 90%;
            max-width: 400px;
            height: 580px;
            background: var(--envelope-bg);
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.18), 0 5px 15px rgba(0,0,0,0.08);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* Realistic Envelope Flaps */
        .envelope-flap-top {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: #ece7dc;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 4;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-bottom: 1px solid var(--border-lux);
        }

        .envelope-pocket-left {
            position: absolute;
            bottom: 0; left: 0; width: 52%; height: 60%;
            background: #ede7da;
            clip-path: polygon(0 0, 100% 40%, 100% 100%, 0 100%);
            z-index: 3;
            border-right: 1px solid var(--border-lux);
        }

        .envelope-pocket-right {
            position: absolute;
            bottom: 0; right: 0; width: 52%; height: 60%;
            background: #e7e1d4;
            clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 100%);
            z-index: 3;
        }

        /* Ultra-Realistic Embossed Wax Seal */
        .wax-seal {
            width: 86px;
            height: 86px;
            background: radial-gradient(circle at 35% 35%, #9d96c4 0%, #686193 60%, #48426d 100%);
            border: 2px solid #554e7d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -3px 6px rgba(0,0,0,0.4);
            z-index: 5;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: seal-pulse 2.5s infinite ease-in-out;
        }

        .wax-seal::after {
            content: "";
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px dashed rgba(255,255,255,0.25);
            border-radius: 50%;
            pointer-events: none;
        }

        .wax-seal span {
            font-family: 'Pinyon Script', cursive;
            font-size: 32px;
            color: #f0ecff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 -1px 1px rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .wax-seal:hover {
            transform: scale(1.08);
        }
